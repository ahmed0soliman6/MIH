name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build:ci
      # حارس أمني: ممنوع وجود مفتاح Google (AIza...) أو أسرار في الحزمة الناتجة
      - name: Fail if a real API key leaked into the bundle
        run: |
          if grep -rEho "AIza[0-9A-Za-z_-]{35}" dist | head -1 | grep -q .; then
            echo "Possible Google API key found in build output"; exit 1
          fi
